# Pages CMS settings for mirabellemorah.com
# This file tells Pages CMS which folders are editable and what boxes to show.

media:
  input: assets/blog-assets
  output: /assets/blog-assets
  categories: [image]

content:
  # 1. The list of categories. Add, rename or delete categories here.
  - name: categories
    label: Categories
    type: collection
    path: content/categories
    filename: "{primary}.md"
    view:
      primary: name
    fields:
      - name: name
        label: Category name
        type: string
        required: true

  # 2. The blog posts themselves.
  - name: posts
    label: Blog posts
    type: collection
    path: content/blog
    filename: "{primary}.md"
    exclude: ["README.md"]
    view:
      primary: title
      fields: [date, category, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
      - name: category
        label: Category
        type: reference
        options:
          collection: categories
          value: "{primary}"
          label: "{primary}"
      - name: summary
        label: Short summary (shown on the blog list and when shared)
        type: text
      - name: seo_title
        label: "SEO title (optional, about 60 characters. Leave empty to use the post title)"
        type: string
      - name: seo_description
        label: "SEO description (optional, about 155 characters. Leave empty to use the short summary)"
        type: text
      - name: cover
        label: Header image
        type: image
      - name: cover_alt
        label: Header image description (for screen readers)
        type: string
      - name: draft
        label: Draft (tick to hide this post from the website)
        type: boolean
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
          switcher: true
