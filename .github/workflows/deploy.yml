name: Build blog and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Collect only the website files
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude='_site' --exclude='.git' --exclude='.github' \
            --exclude='node_modules' --exclude='templates' --exclude='content' \
            --exclude='HIDDEN-FILES-visible-copies' --exclude='.pages.yml' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='BLOG-*.md' --exclude='.gitignore' --exclude='.DS_Store'
          touch _site/.nojekyll
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true