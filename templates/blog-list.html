<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMCL0LW4XQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    gtag("config", "G-FMCL0LW4XQ");
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Writing | Mirabelle Morah</title>
  <meta name="description" content="Writing by Mirabelle Morah." />
  <link rel="canonical" href="{{url}}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Writing | Mirabelle Morah" />
  <meta property="og:description" content="Writing by Mirabelle Morah." />
  <meta property="og:image" content="{{og_image}}" />
  <meta property="og:image:alt" content="{{og_image_alt}}" />
  <meta property="og:url" content="{{url}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Writing | Mirabelle Morah" />
  <meta name="twitter:description" content="Writing by Mirabelle Morah." />
  <meta name="twitter:image" content="{{og_image}}" />
  <meta name="twitter:image:alt" content="{{og_image_alt}}" />
  <meta name="author" content="Mirabelle Morah" />

  <!-- Structured data for search engines -->
  {{json_ld}}

  <link rel="stylesheet" href="{{root}}styles/base.css" />
  <link rel="stylesheet" href="{{root}}styles/global.css" />
  <link rel="stylesheet" href="{{root}}styles/fp-style.css" />
  <link rel="stylesheet" href="{{root}}styles/blog-style.css" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/assets/home-page-assets/favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/home-page-assets/apple-touch-icon.png" />
</head>

<body class="blog-list-page">
  <!-- @include navbar current="blog" -->

  <div class="sav">
    <!-- @include star-toggle -->
    <!-- @include view-all text="View my work" -->
    <!-- @include availability -->
  </div>

  <main>
    <div class="blog-list-wrap">
      <h1>Writing</h1>
      <p class="blog-list-intro">Notes, lessons and stories.</p>

      <div class="blog-tools">
        <form class="blog-search" role="search" onsubmit="return false">
          <button type="button" class="blog-search-toggle" aria-label="Search posts" aria-expanded="false"
            aria-controls="blog-search-input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <line x1="15.5" y1="15.5" x2="21" y2="21" />
            </svg>
          </button>
          <input id="blog-search-input" type="search" placeholder="Search posts" aria-label="Search posts"
            autocomplete="off" data-index="{{root}}blog/search-index.json" tabindex="-1" />
        </form>

        <div class="blog-filters" aria-label="Filter posts by category">
          <button type="button" class="selected" data-filter="all">All</button>
          {{category_filters}}
        </div>
      </div>
      <p class="blog-search-status" aria-live="polite"></p>

      <ol class="blog-items">
        {{post_list}}
      </ol>

      <p class="blog-empty" hidden>No posts found. Try different words or another category.</p>

      <nav class="blog-pager" aria-label="Blog pages" data-per-page="{{per_page}}" hidden></nav>
    </div>
  </main>

  <!-- @include footer -->

  <script src="{{root}}scripts/menu.js"></script>
  <script src="{{root}}scripts/blog.js"></script>
</body>

</html>
